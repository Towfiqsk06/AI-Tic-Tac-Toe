<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Play Tic Tac Toe against an unbeatable AI powered by the minimax algorithm.">
  <title>Tic Tac Toe AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="eyebrow">PYTHON • FLASK • MINIMAX AI</div>
      <h1>Tic Tac Toe<span>.</span></h1>
      <p>Can you outsmart the AI? Make your move as <strong>X</strong>.</p>
    </header>

    <section class="game-card" aria-label="Tic Tac Toe game">
      <div class="scoreboard">
        <div class="score active" id="human-score"><span class="symbol">X</span><span>You</span><b id="wins">0</b></div>
        <div class="score" id="ai-score"><span class="symbol">O</span><span>AI</span><b id="losses">0</b></div>
        <div class="score"><span class="symbol draw-symbol">=</span><span>Draws</span><b id="draws">0</b></div>
      </div>

      <div class="status" id="status" role="status" aria-live="polite">Your turn — choose a square.</div>
      <div class="board" id="board" role="grid" aria-label="Tic Tac Toe board">
        {% for i in range(9) %}
        <button class="cell" data-index="{{ i }}" role="gridcell" aria-label="Square {{ i + 1 }}" type="button"></button>
        {% endfor %}
      </div>

      <div class="actions">
        <button class="primary" id="new-game" type="button">New game</button>
        <button class="secondary" id="reset-score" type="button">Reset scores</button>
      </div>
      <p class="hint"><span class="dot"></span> AI uses Minimax search and plays optimally.</p>
    </section>
    <footer>Built with Python, Flask, HTML, CSS and JavaScript.</footer>
  </main>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
